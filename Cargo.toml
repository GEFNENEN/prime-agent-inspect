[package]
name = "prime-agent-inspect"
version = "0.1.0"
edition = "2021"
description = "Read-only analyzer for prime-agent session files"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = 2
