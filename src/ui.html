<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>prime-agent-inspect — 会话分析</title>
<style>
:root{
  --bg:#14121a; --panel:#1c1926; --panel2:#242031; --line:#332e42;
  --fg:#e8e4f0; --dim:#9a93ab; --accent:#8b7fd4; --warm:#d4896a;
  --ok:#6fbf8b; --warn:#d9b45e; --bad:#d46a6a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI","Microsoft YaHei",sans-serif}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;
  border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:10}
header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.02em}
header .path{color:var(--dim);font-size:12px;font-family:ui-monospace,Consolas,monospace}
header .spacer{flex:1}
button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
  border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit}
button:hover{border-color:var(--accent);color:#fff}
button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#14121a;font-weight:600}
main{display:grid;grid-template-columns:360px 1fr;height:calc(100vh - 57px)}
#list{overflow:auto;border-right:1px solid var(--line);background:var(--panel)}
#list .row{padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer}
#list .row:hover{background:var(--panel2)}
#list .row.active{background:var(--panel2);box-shadow:inset 3px 0 0 var(--accent)}
#list .row .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
#list .row .name{font-weight:600;font-size:13px}
#list .row .id{color:var(--dim);font-size:11px;font-family:ui-monospace,Consolas,monospace}
#list .row .meta{color:var(--dim);font-size:11px;margin-top:2px;display:flex;gap:10px;flex-wrap:wrap}
#list .row .meta b{color:var(--fg);font-weight:600}
#detail{overflow:auto;padding:18px 22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:14px 16px;margin-bottom:16px}
.card h2{font-size:13px;margin:0 0 12px;font-weight:600;color:var(--dim);
  text-transform:uppercase;letter-spacing:.06em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.stat{min-width:0}
.stat .k{color:var(--dim);font-size:11px}
.stat .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .v small{font-size:12px;color:var(--dim);font-weight:400}
/* A cwd can be a long absolute path; it must wrap inside its cell instead of
   stretching the grid track and overlapping the neighbour. */
.stat .v.path{font-size:12px;font-weight:400;line-height:1.35;
  overflow-wrap:anywhere;word-break:break-word}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:5px 8px;font-size:12px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--dim);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
tbody tr:hover{background:var(--panel2)}
.bar{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden;display:flex}
.bar span{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.muted{color:var(--dim)}
.mono{font-family:ui-monospace,Consolas,monospace}
.tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:11px;
  background:var(--panel2);color:var(--dim)}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px}
.pill.ok{background:rgba(111,191,139,.15);color:var(--ok)}
.pill.warn{background:rgba(217,180,94,.15);color:var(--warn)}
.pill.bad{background:rgba(212,106,106,.15);color:var(--bad)}
#status{padding:6px 20px;font-size:12px;color:var(--dim);border-bottom:1px solid var(--line)}
#status.err{color:var(--bad)}
canvas{width:100%;height:auto;display:block}
.hint{color:var(--dim);font-size:12px;margin-top:8px}
.tlctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;
  font-size:12px;color:var(--dim)}
.tlctl input{width:72px;background:var(--panel2);color:var(--fg);
  border:1px solid var(--line);border-radius:6px;padding:3px 8px;
  font:inherit;font-variant-numeric:tabular-nums;text-align:right}
.tlctl input:focus{outline:none;border-color:var(--accent)}
/* Hundreds of compaction rows: scroll the pane rather than paginate, so the
   whole tail is reachable without a click per ten rows. */
.tablewrap{max-height:360px;overflow:auto}
.tablewrap th{position:sticky;top:0;background:var(--panel);z-index:1}
/* Composition: donut on the left, legend on the right. The legend rows are
   hover targets too — a 0.5% slice is two pixels wide and impossible to hit. */
.pie{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-top:14px}
.pie svg{width:200px;height:200px;flex:0 0 auto}
.pie .slice{stroke:var(--panel);stroke-width:1.5;cursor:default;
  transition:opacity .12s,transform .12s;transform-origin:100px 100px}
.pie .slice:hover,.pie .slice.on{opacity:.78;transform:scale(1.018)}
.pie .hole{fill:var(--panel)}
.pie .ctr{fill:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.pie .ctr-sub{fill:var(--dim)}
.pie .side{flex:0 1 560px;min-width:240px}
.pie .side .legend{flex-direction:column;gap:2px;margin-top:0}
.pie .side .legend>span{display:flex;align-items:baseline;gap:8px;padding:3px 6px;
  border-radius:5px;cursor:default}
.pie .side .legend>span:hover,.pie .side .legend>span.on{background:var(--panel2)}
.pie .side .legend .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pie .side .legend b{font-variant-numeric:tabular-nums}
.pie .side .legend .sh{width:52px;text-align:right;color:var(--dim);
  font-variant-numeric:tabular-nums}
.pie .side .legend .en{width:64px;text-align:right;color:var(--dim);
  font-variant-numeric:tabular-nums;font-size:11px}
.pietip{position:fixed;z-index:60;display:none;pointer-events:none;
  background:var(--panel2);border:1px solid var(--accent);border-radius:8px;
  padding:8px 10px;font-size:12px;line-height:1.55;min-width:190px;
  box-shadow:0 8px 28px rgba(0,0,0,.5)}
.pietip .h{display:flex;align-items:center;gap:6px;font-weight:600;margin-bottom:5px}
.pietip .h i{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
.pietip .r{display:flex;justify-content:space-between;gap:16px;color:var(--dim)}
.pietip .r b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.pietip .n{margin-top:5px;padding-top:5px;border-top:1px solid var(--line);
  color:var(--dim);font-size:11px;max-width:240px}
.pietip .more{margin-top:6px;color:var(--accent);font-size:11px}
/* Content viewer: the tooltip gives numbers, this gives the text behind them. */
.pie .slice{cursor:pointer}
.pie .side .legend>span{cursor:pointer}
.modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;
  justify-content:center;background:rgba(10,9,14,.72);padding:24px}
.modal.open{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  width:min(1080px,100%);max-height:100%;display:flex;flex-direction:column;
  box-shadow:0 24px 80px rgba(0,0,0,.6)}
.sheet header{position:static;background:var(--panel);border-bottom:1px solid var(--line);
  border-radius:12px 12px 0 0;padding:12px 16px;gap:12px}
.sheet header h3{margin:0;font-size:14px;font-weight:600;display:flex;
  align-items:center;gap:8px}
.sheet header h3 i{width:10px;height:10px;border-radius:3px}
.sheet header .meta{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
.sheet .body{overflow:auto;padding:0 16px 8px}
.sheet .foot{display:flex;align-items:center;gap:10px;padding:10px 16px;
  border-top:1px solid var(--line);color:var(--dim);font-size:12px}
.sheet .foot .info{margin-right:auto}
.ent{border-bottom:1px solid var(--line);padding:10px 0}
.ent .head{display:flex;gap:10px;align-items:baseline;font-size:11px;color:var(--dim);
  font-variant-numeric:tabular-nums;margin-bottom:6px}
.ent .head .k{color:var(--fg);font-weight:600;font-size:12px}
.ent .head .sp{flex:1}
.ent pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;
  font:12px/1.55 ui-monospace,Consolas,monospace;color:#d8d3e4;
  background:var(--panel2);border-radius:6px;padding:8px 10px;max-height:260px;
  overflow:auto}
.ent .role{display:inline-block;font-size:10px;letter-spacing:.04em;color:var(--dim);
  text-transform:uppercase;margin:6px 0 3px}
.ent .cut{color:var(--warn);font-size:11px;margin-top:4px}
.sheet .empty{color:var(--dim);padding:24px 0;text-align:center;font-size:13px}
</style>
</head>
<body>
<header>
  <h1>prime-agent-inspect</h1>
  <span class="path" id="root"></span>
  <span class="spacer"></span>
  <span class="muted" id="stamp"></span>
  <button id="refresh" class="primary">刷新</button>
</header>
<div id="status">就绪</div>
<main>
  <div id="list"></div>
  <div id="detail"><p class="muted">左侧选择一个会话。</p></div>
</main>

<script>
"use strict";

const PALETTE = ["#8b7fd4","#d4896a","#6fbf8b","#d9b45e","#6aa9d4","#d46a9f","#9ad46a","#c0c0c8"];

/// How many compactions to show. 0 means all; anything else keeps the newest N,
/// which is what you want when a session has 200+ of them.
/// 50 is the default because the interesting part of a timeline is the recent
/// shape, not the whole history — and it still fits on one screen.
const RECENT_DEFAULT = 50;
/// Persisted in localStorage, which is per-origin: it survives page reloads and
/// server restarts, but is not shared with another browser or another port.
const RECENT_KEY = "prime-agent-inspect.recent";

const state = {
  sessions: [], selected: null, detail: null,
  recent: loadRecent(), shownTotal: 0,
};

const $ = (id) => document.getElementById(id);

function bytes(n) {
  if (n < 1024) return n + " B";
  const units = ["K","M","G"]; let v = n, i = -1;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return v.toFixed(1) + units[i];
}
function num(n) { return (n ?? 0).toLocaleString("en-US"); }
function pct(x) { return (x * 100).toFixed(1) + "%"; }
function when(ms) {
  if (!ms) return "—";
  const d = new Date(ms);
  const pad = (x) => String(x).padStart(2, "0");
  return `${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, (c) =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
}
function setStatus(text, isError) {
  const el = $("status");
  el.textContent = text;
  el.className = isError ? "err" : "";
}

async function getJSON(url) {
  const res = await fetch(url, { cache: "no-store" });
  if (!res.ok) throw new Error(await res.text() || res.statusText);
  return res.json();
}

async function refreshList() {
  setStatus("扫描会话…");
  try {
    const data = await getJSON("/api/sessions");
    state.sessions = data.sessions;
    $("root").textContent = data.root;
    renderList();
    $("stamp").textContent = "快照 " + new Date().toLocaleTimeString("zh-CN");
    setStatus(`${data.sessions.length} 个会话，共 ${bytes(data.totalBytes)}`);
    if (state.selected) await openSession(state.selected, true);
  } catch (error) {
    setStatus("列出会话失败：" + error.message, true);
  }
}

function renderList() {
  const el = $("list");
  if (!state.sessions.length) { el.innerHTML = '<p class="muted" style="padding:14px">没有会话文件。</p>'; return; }
  el.innerHTML = state.sessions.map((s) => {
    const active = s.id === state.selected ? " active" : "";
    const label = s.name ? esc(s.name) : esc(s.id.slice(0, 13));
    const near = s.peak > 0 ? "" : "";
    return `<div class="row${active}" data-id="${esc(s.id)}">
      <div class="top"><span class="name">${label}</span>
        <span class="id">${esc(s.id.slice(0, 8))}</span></div>
      <div class="meta">
        <span>${bytes(s.bytes)}</span>
        <span>${num(s.entries)} 条</span>
        <span>压缩 <b>${num(s.compactions)}</b></span>
        <span>峰值 <b>${num(s.peak)}</b></span>
      </div>
    </div>`;
  }).join("");
  el.querySelectorAll(".row").forEach((row) => {
    row.addEventListener("click", () => openSession(row.dataset.id));
  });
}

async function openSession(id, keepScroll) {
  state.selected = id;
  renderList();
  setStatus("读取会话…");
  try {
    const data = await getJSON("/api/session?id=" + encodeURIComponent(id));
    state.detail = data;
    renderDetail(data);
    setStatus(`已加载 ${data.id.slice(0, 8)} · ${num(data.entries)} 条 · ${bytes(data.bytes)}`);
  } catch (error) {
    $("detail").innerHTML = '<p class="muted">加载失败：' + esc(error.message) + "</p>";
    setStatus("加载失败：" + error.message, true);
  }
}

function renderDetail(d) {
  hidePieTip();
  if (d.error) { $("detail").innerHTML = '<p class="muted">' + esc(d.error) + "</p>"; return; }
  const parts = [];

  // Summary stats
  const accuracy = d.accuracy;
  const acc = accuracy
    ? `<span class="pill ${accuracy.median < 0.1 ? "ok" : "warn"}">误差中位 ${pct(accuracy.median)}</span>`
    : '<span class="pill">无实测点</span>';
  const fixed = d.fixed.measured
    ? `<span class="pill ok">固定 ${num(d.fixed.tokens)} (${d.fixed.samples} 点实测)</span>`
    : `<span class="pill warn">固定 ${num(d.fixed.tokens)} (假设值)</span>`;

  parts.push(`<div class="card"><h2>概览</h2><div class="grid">
    <div class="stat"><div class="k">当前 prompt</div>
      <div class="v">${num(d.prompt.fullTokens)} <small>tokens</small></div></div>
    <div class="stat"><div class="k">其中正文</div>
      <div class="v">${num(d.prompt.contentTokens)} <small>tokens</small></div></div>
    <div class="stat"><div class="k">压缩次数</div>
      <div class="v">${num(d.timeline.length)}</div></div>
    <div class="stat"><div class="k">分支条目</div>
      <div class="v">${num(d.branchEntries)}
      <small>/ ${num(d.entries)}</small></div></div>
    <div class="stat"><div class="k">工作目录</div>
      <div class="v path mono">${esc(d.cwd)}</div></div>
    <div class="stat"><div class="k">时间跨度</div>
      <div class="v" style="font-size:13px">${when(d.firstAt)} → ${when(d.lastAt)}</div></div>
  </div><div class="legend">${acc} ${fixed}</div></div>`);

  // Composition. A donut over the *whole* prompt: content components plus the
  // fixed overhead. The old stacked bar only covered content, so the ~11% you
  // pay for the system prompt and tool definitions had no slice at all.
  const compItems = compositionItems(d);
  parts.push(compositionCard(d, compItems));

  // Retained rows split by tool: the composition above says toolResult is N%,
  // this says which tool produced it. Same 250 rows, finer granularity.
  if (d.prompt.tools && d.prompt.tools.length) {
    const toolTotal = d.prompt.tools.reduce((sum, t) => sum + t.tokens, 0);
    const tbar = d.prompt.tools.map((t, i) =>
      `<span style="width:${(t.tokens/(toolTotal||1)*100).toFixed(2)}%;background:${PALETTE[(i+4)%PALETTE.length]}"
        title="${esc(t.tool)} ${num(t.tokens)}"></span>`).join("");
    const trows = d.prompt.tools.map((t, i) =>
      `<tr>
        <td class="mono"><i style="display:inline-block;width:9px;height:9px;border-radius:2px;
          background:${PALETTE[(i+4)%PALETTE.length]};margin-right:7px"></i>${esc(t.tool)}</td>
        <td>${num(t.tokens)}</td>
        <td>${pct(t.share)}</td>
        <td>${num(t.entries)}</td>
        <td>${num(t.chars)}</td>
      </tr>`).join("");
    parts.push(`<div class="card"><h2>保留内容的工具细分
        <span class="muted" style="text-transform:none;letter-spacing:0">同一批 ${num(d.prompt.keptEntries)} 条，按工具拆分</span></h2>
      <div class="bar">${tbar}</div>
      <table style="margin-top:12px"><thead><tr>
        <th>工具</th><th>tokens</th><th>占 toolResult</th><th>条目</th><th>字符</th>
      </tr></thead><tbody>${trows}</tbody></table>
      <p class="hint">这是上面「保留 toolResult」那一项的展开：总量相同，只是按工具分开。
        哪一列最大，就知道该压缩哪类工具的输出。</p></div>`);
  }

  // Entry kinds: the whole branch, including what compaction already dropped.
  // Its numbers are larger than the composition above on purpose.
  if (d.entryKinds.length) {
    const krows = d.entryKinds.map((k) =>
      `<tr><td class="mono">${esc(k.kind)}</td><td>${num(k.count)}</td></tr>`).join("");
    parts.push(`<div class="card"><h2>条目构成
        <span class="muted" style="text-transform:none;letter-spacing:0">整条分支 ${num(d.branchEntries)} 条，含已被压缩丢弃的</span></h2>
      <table><thead><tr><th>类型</th><th>数量</th></tr></thead><tbody>${krows}</tbody></table>
      <p class="hint">这是文件里全部条目的类型分布，<b>不是</b>上面那份 prompt 的细分——
        上面只含切点之后被重放的 ${num(d.prompt.keptEntries)} 条。</p></div>`);
  }

  // Repeated notices
  if (d.notices.length) {
    const nrows = d.notices.slice(0, 12).map((n) =>
      `<tr><td class="mono">${esc(n.type)}</td><td>${num(n.copies)}</td><td>${num(n.chars)}</td></tr>`).join("");
    parts.push(`<div class="card"><h2>重复注入的消息</h2>
      <table><thead><tr><th>类型</th><th>份数</th><th>字符</th></tr></thead>
      <tbody>${nrows}</tbody></table>
      <p class="hint">同一类型重复出现，是上下文膨胀的常见来源。</p></div>`);
  }

  // Timeline: chart and detail table show the same series, so one control
  // governs both. "Recent N" beats pagination here — a 220-compaction session
  // is a shape you read at a glance, not page by page.
  parts.push(`<div class="card"><h2>压缩时间线
      <span class="muted" style="text-transform:none;letter-spacing:0">${num(d.timeline.length)} 次</span></h2>
    <div class="tlctl">
      <label for="recent">显示最近</label>
      <input id="recent" type="number" min="0" step="1" inputmode="numeric"
        value="${esc(state.recent)}" title="填 0 显示全部">
      <span>次</span>
      <span>（0 = 全部）</span>
      <span id="recent-note"></span>
    </div>
    <canvas id="chart" height="240"></canvas>
    <div class="legend">
      <span><i style="background:#d46a6a"></i>压缩前</span>
      <span><i style="background:#6fbf8b"></i>压缩后</span>
      <span><i style="background:#6aa9d4"></i>保留尾</span>
    </div>
  </div>`);

  parts.push(`<div class="card"><h2>压缩明细
      <span class="muted" style="text-transform:none;letter-spacing:0">共 ${num(d.timeline.length)} 次</span></h2>
    <div class="tablewrap"><table><thead><tr>
      <th>时间</th><th>压缩前</th><th>压缩后</th><th>保留尾</th><th>notice</th><th>副本</th><th>间隔轮数</th>
    </tr></thead><tbody id="timeline-body"></tbody></table></div>
    <p class="hint">倒序排列，最新在上。「间隔轮数」小于 10 表示在连环压缩——这是要排查的形态。</p>
  </div>`);

  $("detail").innerHTML = parts.join("");
  setupComposition(d, compItems);
  setupTimeline(d.timeline);
}

function loadRecent() {
  try {
    const raw = window.localStorage.getItem(RECENT_KEY);
    const value = raw == null ? NaN : Number.parseInt(raw, 10);
    if (Number.isFinite(value) && value >= 0) return value;
  } catch (_) { /* localStorage can be blocked; the default is fine */ }
  return RECENT_DEFAULT;
}

function saveRecent(value) {
  try { window.localStorage.setItem(RECENT_KEY, String(value)); } catch (_) {}
}

/// The tail of the (chronological) timeline, per the current setting.
function visibleTimeline(timeline) {
  const n = state.recent;
  return n > 0 && n < timeline.length ? timeline.slice(timeline.length - n) : timeline;
}

function setupTimeline(timeline) {
  const input = $("recent");
  state.shownTotal = timeline.length;
  const apply = () => {
    drawChart(visibleTimeline(timeline));
    renderTimelineRows(visibleTimeline(timeline));
  };
  input.value = String(state.recent);
  input.addEventListener("input", () => {
    const raw = input.value.trim();
    if (raw === "") return; // mid-edit: keep the last valid view
    const value = Number.parseInt(raw, 10);
    if (!Number.isFinite(value) || value < 0) return;
    state.recent = value;
    saveRecent(value);
    apply();
  });
  // Blur or Enter with an empty/garbage box falls back to the default rather
  // than leaving the table showing something the field no longer describes.
  input.addEventListener("change", () => {
    const value = Number.parseInt(input.value, 10);
    state.recent = Number.isFinite(value) && value >= 0 ? value : RECENT_DEFAULT;
    input.value = String(state.recent);
    saveRecent(state.recent);
    apply();
  });
  apply();
}

/// Newest first. Rows are all in the DOM — the wrap scrolls, so a 220-row
/// tail stays reachable without paging.
function renderTimelineRows(timeline) {
  const body = $("timeline-body");
  if (!body) return;
  const note = $("recent-note");
  const shown = timeline.length;
  if (note) {
    note.textContent = shown < state.shownTotal
      ? `显示最近 ${num(shown)} / ${num(state.shownTotal)} 次`
      : "";
  }
  const ordered = timeline.slice().reverse();
  body.innerHTML = ordered.length
    ? ordered.map((p) => {
        const gap = p.turns != null && p.turns < 10
          ? `<span class="pill bad">${p.turns}</span>` : num(p.turns);
        return `<tr>
          <td class="mono">${when(p.at)}</td>
          <td>${num(p.before)}</td>
          <td>${p.after != null ? num(p.after) : "—"}</td>
          <td>${num(p.retained)}</td>
          <td>${num(p.notice)}</td>
          <td>${num(p.copies)}</td>
          <td>${gap}</td>
        </tr>`;
      }).join("")
    : '<tr><td colspan="7" class="muted">无压缩</td></tr>';
}

// ---------------------------------------------------------------- composition

/// Slices of the donut: every prompt component plus the fixed overhead, so the
/// shares add up to the number the provider actually bills. The backend's
/// `share` is relative to content only, which is exactly the confusion this
/// chart is meant to remove, so shares are recomputed here.
const FIXED_SLICE = "#5c5670";

function compositionItems(d) {
  const items = d.prompt.components.map((c, i) => ({
    label: c.label,
    tokens: c.tokens,
    chars: c.chars,
    cjk: c.cjk,
    entries: c.entries,
    estimated: c.estimated,
    color: PALETTE[i % PALETTE.length],
    fixed: false,
  }));
  const fixed = d.fixed || { tokens: 0 };
  if (fixed.tokens > 0) {
    items.push({
      label: "固定开销",
      tokens: fixed.tokens,
      chars: null,
      cjk: null,
      entries: null,
      estimated: !fixed.measured,
      color: FIXED_SLICE,
      fixed: true,
      measured: fixed.measured,
      samples: fixed.samples,
    });
  }
  const total = items.reduce((sum, it) => sum + it.tokens, 0);
  for (const it of items) it.share = total ? it.tokens / total : 0;
  return items;
}

function compositionCard(d, items) {
  const total = items.reduce((sum, it) => sum + it.tokens, 0);
  const legend = items.map((it, i) => `<span data-slice="${i}" title="点击查看具体内容">
      <i style="background:${it.color}"></i>
      <span class="lbl">${esc(it.label)}</span>
      <b>${num(it.tokens)}</b>
      <span class="sh">${pct(it.share)}</span>
      <span class="en">${it.entries == null ? "" : num(it.entries) + " 条"}</span>
    </span>`).join("");
  return `<div class="card"><h2>上下文组成
      <span class="muted" style="text-transform:none;letter-spacing:0">下一轮会发出去的全部内容，含固定开销</span></h2>
    <div class="pie" id="pie">
      <svg viewBox="0 0 200 200" role="img" aria-label="prompt 组成饼图">
        ${donutPaths(items)}
        <circle class="hole" cx="100" cy="100" r="56"></circle>
        <text class="ctr" x="100" y="97" text-anchor="middle" font-size="17">${num(total)}</text>
        <text class="ctr-sub" x="100" y="113" text-anchor="middle" font-size="10">tokens</text>
      </svg>
      <div class="side"><div class="legend">${legend}</div></div>
    </div>
    <p class="hint">正文 ${num(d.prompt.contentTokens)} + 固定开销 ${num((d.fixed || {}).tokens)}
       = ${num(total)}。保留 ${num(d.prompt.keptEntries)} 条，丢弃 ${num(d.prompt.droppedEntries)} 条（切点之前的历史）。
      悬停看每块的字符数、条目数与占比。</p>
  </div>`;
}

/// One annular sector per slice. Angles start at 12 o'clock and go clockwise,
/// which matches how the legend reads.
function donutPaths(items) {
  const cx = 100, cy = 100, rOut = 92, rIn = 56;
  const point = (a, r) => [cx + r * Math.sin(a), cy - r * Math.cos(a)];
  const total = items.reduce((sum, it) => sum + it.tokens, 0) || 1;
  // Hairline gaps keep neighbouring slices legible; skipped when a slice is so
  // thin that removing 0.9° would erase it.
  const GAP = 0.9 * Math.PI / 180;
  let angle = 0;
  return items.map((it, i) => {
    if (it.tokens <= 0) return "";
    const sweep = (it.tokens / total) * Math.PI * 2;
    const gap = sweep > GAP * 2.5 ? GAP : 0;
    const a0 = angle + gap;
    const a1 = angle + sweep - gap;
    angle += sweep;
    const large = a1 - a0 > Math.PI ? 1 : 0;
    const [x0, y0] = point(a0, rOut);
    const [x1, y1] = point(a1, rOut);
    const [x2, y2] = point(a1, rIn);
    const [x3, y3] = point(a0, rIn);
    const dPath = `M ${x0.toFixed(2)} ${y0.toFixed(2)}
      A ${rOut} ${rOut} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}
      L ${x2.toFixed(2)} ${y2.toFixed(2)}
      A ${rIn} ${rIn} 0 ${large} 0 ${x3.toFixed(2)} ${y3.toFixed(2)} Z`;
    return `<path class="slice" data-slice="${i}" d="${dPath}" fill="${it.color}"
      fill-rule="evenodd"></path>`;
  }).join("");
}

let pieTip = null;
function hidePieTip() {
  if (pieTip) pieTip.style.display = "none";
  for (const el of document.querySelectorAll(".pie .on")) el.classList.remove("on");
}

/// The tooltip is fixed to the viewport, so it must not outlive the card: one
/// capture-phase dismiss listener, registered once.
function pieDismissOnScroll() {
  if (pieDismissOnScroll.done) return;
  pieDismissOnScroll.done = true;
  document.addEventListener("scroll", hidePieTip, true);
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    hidePieTip();
    closeViewer();
  });
}

function pieTooltip() {
  if (!pieTip) {
    pieTip = document.createElement("div");
    pieTip.className = "pietip";
    document.body.appendChild(pieTip);
  }
  return pieTip;
}

/// Detail for one slice. This is the part the stacked bar could not show: it
/// had a one-line `title` and no room for characters, share of the full prompt
/// or what is inside a toolResult bucket.
function pieTipHTML(d, item) {
  const rows = [];
  const push = (k, v) => rows.push(`<div class="r"><span>${k}</span><b>${v}</b></div>`);
  push("tokens", num(item.tokens));
  push("占整个 prompt", pct(item.share));
  if (!item.fixed && d.prompt.contentTokens) {
    push("占正文", pct(item.tokens / d.prompt.contentTokens));
  }
  if (item.chars != null) push("字符", num(item.chars));
  if (item.cjk != null) push("其中 CJK 字符", num(item.cjk));
  if (item.entries != null) push("条目", num(item.entries));

  let note = "";
  if (item.fixed) {
    note = item.measured
      ? `系统提示 + 工具定义，从 ${num(item.samples)} 个压缩点反推。会话文件里没有这部分。`
      : "系统提示 + 工具定义，是假设值：这个会话没有可用的实测点。";
  } else if (/toolResult/.test(item.label) && d.prompt.tools && d.prompt.tools.length) {
    const top = d.prompt.tools.slice(0, 4).map((t) =>
      `${esc(t.tool)} ${num(t.tokens)}`).join(" · ");
    const more = d.prompt.tools.length > 4 ? ` 等 ${d.prompt.tools.length} 种` : "";
    note = `按工具拆分：${top}${more}`;
  } else if (item.estimated) {
    note = "估算值：按 CJK 感知的字符/token 系数换算。";
  }
  const more = item.fixed
    ? `<div class="more">系统提示与工具定义不在会话文件里，无法列出正文。</div>`
    : `<div class="more">点击查看这 ${num(item.entries)} 条的具体内容 →</div>`;
  return `<div class="h"><i style="background:${item.color}"></i>${esc(item.label)}</div>
    ${rows.join("")}${note ? `<div class="n">${note}</div>` : ""}${more}`;
}

function setupComposition(d, items) {
  const card = $("pie");
  if (!card || !items.length) return;
  const tip = pieTooltip();
  pieDismissOnScroll();
  const slices = Array.from(card.querySelectorAll(".slice"));
  const legends = Array.from(card.querySelectorAll(".legend>span"));
  const pairs = [slices, legends];

  const highlight = (index, on) => {
    for (const group of pairs) {
      for (const el of group) {
        const match = Number(el.dataset.slice) === index;
        el.classList.toggle("on", on && match);
      }
    }
  };

  const show = (index, event) => {
    const item = items[index];
    if (!item) return;
    tip.innerHTML = pieTipHTML(d, item);
    tip.style.display = "block";
    move(event);
    highlight(index, true);
  };
  const move = (event) => {
    if (!event) return;
    const pad = 14;
    const box = tip.getBoundingClientRect();
    let x = event.clientX + pad;
    let y = event.clientY + pad;
    if (x + box.width > window.innerWidth - 8) x = event.clientX - box.width - pad;
    if (y + box.height > window.innerHeight - 8) y = event.clientY - box.height - pad;
    tip.style.left = Math.max(8, x) + "px";
    tip.style.top = Math.max(8, y) + "px";
  };
  const hide = (index) => {
    tip.style.display = "none";
    highlight(index, false);
  };

  for (const group of pairs) {
    for (const el of group) {
      const index = Number(el.dataset.slice);
      el.addEventListener("mouseenter", (e) => show(index, e));
      el.addEventListener("mousemove", move);
      el.addEventListener("mouseleave", () => hide(index));
      el.addEventListener("click", () => openViewer(items[index]));
    }
  }
}

// ------------------------------------------------------------- content viewer

/// The text behind a slice, fetched on demand: the detail payload carries entry
/// ids only, because shipping the content of every bucket would duplicate
/// megabytes for a tooltip nobody opened.
const SLICE_PAGE = 12;

const viewer = { label: null, page: 0, pages: 1, total: 0, loading: false, el: null };

function viewerEl() {
  if (viewer.el) return viewer.el;
  const wrap = document.createElement("div");
  wrap.className = "modal";
  wrap.id = "viewer";
  wrap.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">
      <header>
        <h3 id="v-title"></h3>
        <span class="meta" id="v-meta"></span>
        <span class="spacer" style="flex:1"></span>
        <button id="v-close">关闭 (Esc)</button>
      </header>
      <div class="body" id="v-body"></div>
      <div class="foot">
        <span class="info" id="v-info"></span>
        <button id="v-prev">‹ 更旧</button>
        <button id="v-next">更新 ›</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  wrap.addEventListener("click", (event) => {
    // Clicking the backdrop closes; clicking the sheet does not.
    if (event.target === wrap) closeViewer();
  });
  wrap.querySelector("#v-close").addEventListener("click", closeViewer);
  // "上一页" walks toward older entries, "下一页" toward newer.
  wrap.querySelector("#v-prev").addEventListener("click", () => loadSlice(viewer.page + 1));
  wrap.querySelector("#v-next").addEventListener("click", () => loadSlice(viewer.page - 1));
  viewer.el = wrap;
  return wrap;
}

function closeViewer() {
  if (viewer.el) viewer.el.classList.remove("open");
}

function openViewer(item) {
  if (!item || item.fixed) return;
  hidePieTip();
  viewer.label = item.label;
  viewer.total = item.entries || 0;
  viewer.page = 0;
  const el = viewerEl();
  el.classList.add("open");
  el.querySelector("#v-title").innerHTML =
    `<i style="background:${item.color}"></i>${esc(item.label)}`;
  el.querySelector("#v-meta").textContent =
    `${num(item.tokens)} tokens · ${pct(item.share)} of prompt · ${num(item.entries)} 条`;
  el.querySelector("#v-body").innerHTML = '<p class="empty">载入中…</p>';
  loadSlice(0);
}

async function loadSlice(page) {
  if (viewer.loading || !viewer.label) return;
  viewer.loading = true;
  const el = viewerEl();
  const info = el.querySelector("#v-info");
  info.textContent = "载入中…";
  // Pages count from the end: the tail of a bucket is what pushed the context
  // over, so page 0 shows the newest entries.
  const pages = Math.max(1, Math.ceil(viewer.total / SLICE_PAGE));
  const current = Math.min(Math.max(0, page), pages - 1);
  const offset = Math.max(0, viewer.total - (current + 1) * SLICE_PAGE);
  try {
    const url = `/api/slice?id=${encodeURIComponent(state.selected)}`
      + `&label=${encodeURIComponent(viewer.label)}`
      + `&offset=${offset}&limit=${SLICE_PAGE}`;
    const data = await getJSON(url);
    if (data.error) throw new Error(data.error);
    viewer.page = current;
    viewer.pages = pages;
    viewer.total = data.total;
    el.querySelector("#v-body").innerHTML = data.rows.length
      ? data.rows.slice().reverse().map(entryCard).join("")
      : '<p class="empty">这一块没有条目。</p>';
    const to = data.offset + data.rows.length;
    const range = data.rows.length ? `${data.offset + 1}–${to}` : "0";
    info.textContent = `第 ${current + 1} / ${pages} 页 · ${range} / ${num(data.total)} 条`
      + (data.truncated ? ` · ${num(data.truncated)} 段被截断` : "")
      + " · 倒序";
    el.querySelector("#v-prev").disabled = current >= pages - 1;
    el.querySelector("#v-next").disabled = current <= 0;
    el.querySelector("#v-body").scrollTop = 0;
  } catch (error) {
    el.querySelector("#v-body").innerHTML =
      `<p class="empty">载入失败：${esc(error.message)}</p>`;
    info.textContent = "";
  } finally {
    viewer.loading = false;
  }
}

function entryCard(row) {
  const blocks = (row.blocks || []).map((block) => {
    const cut = block.shown != null && block.shown < block.chars;
    return `<div class="role">${esc(block.role)} · ${num(block.chars)} 字符${cut ? " · 已截断" : ""}</div>
     <pre>${esc(block.text)}</pre>
     ${cut ? `<div class="cut">只显示前 ${num(block.shown)} 字符</div>` : ""}`;
  }).join("") || '<p class="empty">无可读文本。</p>';
  // `chars` is what the token estimate counted; for a tool call that is the
  // argument values, while the preview shows the JSON around them. Say both
  // instead of printing one number that visibly disagrees with the text.
  const delta = row.textChars != null && Math.abs(row.textChars - row.chars) > 2
    ? ` <span title="估算用的是参数值，预览显示的是外层 JSON">(展示 ${num(row.textChars)})</span>`
    : "";
  return `<div class="ent">
    <div class="head">
      <span class="k">${esc(row.kind)}</span>
      <span class="mono">${when(row.at)}</span>
      <span>${num(row.chars)} 字符${delta}</span>
      <span>~${num(row.tokens)} tokens</span>
      <span class="sp"></span>
      <span class="mono">${esc(row.id.slice(0, 8))}</span>
    </div>
    ${blocks}
    ${row.error ? `<div class="cut">读取该行失败：${esc(row.error)}</div>` : ""}
  </div>`;
}

function drawChart(timeline) {
  const canvas = $("chart");
  if (!canvas || !timeline.length) return;
  const dpr = window.devicePixelRatio || 1;
  const cssW = canvas.clientWidth || 800;
  const cssH = 240;
  canvas.width = cssW * dpr; canvas.height = cssH * dpr;
  canvas.style.height = cssH + "px";
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, cssW, cssH);

  const padL = 52, padR = 12, padT = 12, padB = 24;
  const w = cssW - padL - padR, h = cssH - padT - padB;
  const max = Math.max(...timeline.map((p) => Math.max(p.before, p.after ?? 0, p.retained)), 1);
  const niceMax = Math.ceil(max / 50000) * 50000 || max;
  const x = (i) => padL + (timeline.length === 1 ? w / 2 : (i / (timeline.length - 1)) * w);
  const y = (v) => padT + h - (v / niceMax) * h;

  // Grid
  ctx.strokeStyle = "#332e42"; ctx.fillStyle = "#9a93ab";
  ctx.font = "10px ui-monospace,Consolas,monospace"; ctx.textAlign = "right";
  for (let g = 0; g <= 4; g++) {
    const v = (niceMax / 4) * g, yy = y(v);
    ctx.beginPath(); ctx.moveTo(padL, yy); ctx.lineTo(padL + w, yy); ctx.stroke();
    ctx.fillText(niceMax >= 1000 ? Math.round(v / 1000) + "k" : String(Math.round(v)), padL - 6, yy + 3);
  }

  // Retained (area)
  ctx.fillStyle = "rgba(106,169,212,.18)";
  ctx.beginPath(); ctx.moveTo(x(0), y(0));
  timeline.forEach((p, i) => ctx.lineTo(x(i), y(p.retained)));
  ctx.lineTo(x(timeline.length - 1), y(0)); ctx.closePath(); ctx.fill();

  // Before line
  ctx.strokeStyle = "#d46a6a"; ctx.lineWidth = 1.5; ctx.beginPath();
  timeline.forEach((p, i) => { const yy = y(p.before); i ? ctx.lineTo(x(i), yy) : ctx.moveTo(x(i), yy); });
  ctx.stroke();

  // After line
  ctx.strokeStyle = "#6fbf8b"; ctx.beginPath();
  let started = false;
  timeline.forEach((p, i) => {
    if (p.after == null) return;
    const yy = y(p.after);
    started ? ctx.lineTo(x(i), yy) : (ctx.moveTo(x(i), yy), started = true);
  });
  ctx.stroke();

  // Compaction markers with tight gaps highlighted
  timeline.forEach((p, i) => {
    ctx.fillStyle = (p.turns != null && p.turns < 10) ? "#d46a6a" : "#8b7fd4";
    ctx.beginPath(); ctx.arc(x(i), y(p.before), 2.5, 0, Math.PI * 2); ctx.fill();
  });

  // X labels: first and last. With one point they would draw on top of each
  // other, so a single centred label is enough.
  ctx.fillStyle = "#9a93ab"; ctx.textAlign = "left";
  ctx.fillText(when(timeline[0].at), padL, cssH - 8);
  if (timeline.length > 1) {
    ctx.textAlign = "right";
    ctx.fillText(when(timeline[timeline.length - 1].at), padL + w, cssH - 8);
  }
}

$("refresh").addEventListener("click", refreshList);
document.addEventListener("keydown", (e) => {
  if (e.key === "r" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); refreshList(); }
});

refreshList();
</script>
</body>
</html>
